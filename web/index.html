<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- Production SEO Optimization -->
  <title>Fahim Montasir Opi — Flutter Developer Portfolio</title>
  <meta name="description" content="Explore the portfolio of Fahim Montasir Opi, an Associate Software Engineer specializing in cross-platform mobile and web applications with Flutter and Dart.">
  <meta name="keywords" content="Fahim Montasir Opi, Opi, Flutter Developer, Dart Developer, Mobile App Developer, Software Engineer, Portfolio, Supabase, Firebase, GetX, BLoC">
  <meta name="author" content="Fahim Montasir Opi">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fahim Montasir Opi — Flutter Developer Portfolio">
  <meta property="og:description" content="Explore the portfolio of Fahim Montasir Opi, an Associate Software Engineer specializing in cross-platform mobile and web applications with Flutter.">
  <meta property="og:image" content="assets/images/profile.webp">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Fahim Montasir Opi — Flutter Developer Portfolio">
  <meta property="twitter:description" content="Explore the portfolio of Fahim Montasir Opi, an Associate Software Engineer specializing in cross-platform mobile and web applications with Flutter.">
  <meta property="twitter:image" content="assets/images/profile.webp">

  <!-- Google Fonts Preconnect and Preload (Avoid dynamic layout shifts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="portfolio_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Sleek dark loader page */
    .loading-container {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0C0E12;
      z-index: 99999;
      opacity: 1;
      transition: opacity 0.3s ease-out;
    }
    .loader-box {
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      border: 3px solid #14161A;
      border-top: 3px solid #24DB67;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loading-text {
      color: #24DB67;
      margin-top: 24px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Elegant pre-rendering loader -->
  <div id="loading-indicator" class="loading-container">
    <div class="loader-box">
      <div class="spinner"></div>
      <div class="loading-text">Initializing Opi.Dev...</div>
    </div>
  </div>

  <script>
    // MutationObserver to clean up the loader once the flutter-view element mounts in the DOM
    const observer = new MutationObserver((mutations, obs) => {
      const flutterView = document.querySelector('flutter-view');
      if (flutterView) {
        const loader = document.getElementById('loading-indicator');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <script>
    window.flutterConfiguration = {
      renderer: "html"
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
